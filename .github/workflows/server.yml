name: Go PostgreSQL server
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_USER: rai_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: rai_test
          POSTGRES_INITDB_ARGS: --data-checksums
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rai_test -d rai_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RAI_TEST_DATABASE_URL: postgres://rai_test:synthetic-test-only@127.0.0.1:5432/rai_test?sslmode=disable
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Verify formatting and dependencies
        run: |
          test -z "$(gofmt -l cmd internal integration migrations/embed.go)"
          go mod verify
      - name: Unit tests
        run: go test ./...
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Prepare matching PG18.6 archive tools
        run: |
          mkdir -p /tmp/rai-pg18-tools
          python3 - <<'PYTOOLS'
          from pathlib import Path
          image = 'postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc'
          for name in ('pg_dump', 'pg_restore'):
              p = Path('/tmp/rai-pg18-tools') / name
              p.write_text('#!/usr/bin/env bash\nexec docker run --rm -i --network host --user "$(id -u):$(id -g)" -v /tmp:/tmp ' + image + ' ' + name + ' "$@"\n')
              p.chmod(0o700)
          PYTOOLS
          echo 'PGBIN=/tmp/rai-pg18-tools' >> "$GITHUB_ENV"
      - name: Unit and real PostgreSQL regression with race detector
        run: go test -race -count=1 -tags=integration ./...
      - name: Maximum page recovery and synthetic large-table query plans
        run: go test -race -count=1 -tags=integration,scale -run '^TestScale' -timeout=10m ./integration
      - name: Vet and build
        run: |
          go vet ./...
          go vet -tags=integration,scale ./...
          CGO_ENABLED=0 go build -o /tmp/rai-api ./cmd/rai
          CGO_ENABLED=0 go build -o /tmp/rai-worker ./cmd/rai
      - name: Enforce online dependency boundaries
        run: python3 ../../scripts/check-boundaries.py
      - name: Verify sqlc generated code
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/sqlc.tar.gz"
          echo "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  $RUNNER_TEMP/sqlc.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/sqlc.tar.gz" -C "$RUNNER_TEMP" sqlc
          "$RUNNER_TEMP/sqlc" generate
          git diff --exit-code -- internal/storage/postgres/dbgen
