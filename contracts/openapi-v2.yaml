      type: object
      description: Original durable deletion ACK, replayed unchanged. alreadyDeleted describes the original command, not whether this HTTP call is a retry.
      additionalProperties: false
      required: [workoutID, ingestStatus, alreadyDeleted, commitRevision]
      properties:
        workoutID: {$ref: '#/components/schemas/ID'}
        ingestStatus: {const: deleted}
        alreadyDeleted: {type: boolean}
        commitRevision: {type: integer, minimum: 1}
    WorkoutIngestReceipt:
      type: object
      additionalProperties: false
      required: [workoutID, ingestStatus, acceptedAt]
      description: >-
        Durable acceptance ACK. The first successful reception freezes these
        values; later committed/rejected transitions replay the same
        acceptedAt. already_imported responses omit acceptedAt and are not an
        ingest row.
      properties:
        workoutID: {$ref: '#/components/schemas/ID'}
        ingestStatus: {enum: [accepted, already_imported]}
        acceptedAt: {type: string, format: date-time}
    WorkoutIngestStatus:
      type: object
      additionalProperties: false
      required: [workoutID, ingestStatus]
      description: >-
        One-snapshot status. Priority is deleted > accepted/committed/rejected >
        already_imported > 404. Only the caller's dataset is visible.
      properties:
        workoutID: {$ref: '#/components/schemas/ID'}
        ingestStatus: {enum: [deleted, accepted, committed, rejected, already_imported]}
        acceptedAt: {type: string, format: date-time}
        commitRevision: {type: integer, minimum: 1}
        analysisStatus: {enum: [queued, not_required]}
        analysisJobIDs:
          type: array
          items: {$ref: '#/components/schemas/ID'}
          description: Queued analysis job identities; empty for not_required.
        errorCode: {type: string, maxLength: 128}
