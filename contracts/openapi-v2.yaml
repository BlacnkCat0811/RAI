  /v2/training/plans/{id}/history:
    get: {"summary": "Read legacy aggregate Effective history", "operationId": "getTrainingHistory", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/ID"}}, {"name": "after", "in": "query", "schema": {"type": "integer", "minimum": 0, "default": 0}}, {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}}], "responses": {"200": {"description": "Durable receipt or current version", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingLegacyHistory"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}}, "x-response-byte-budget": 1048576, "description": "Deprecated aggregate response retained below 1 MiB. Oversized pages return 413 training_response_requires_pagination and Link to /history/versions. Use summary pages and immutable /detail sections.", "deprecated": true}
  /v2/training/executions:
