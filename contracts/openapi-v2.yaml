components:
  securitySchemes:
    deviceToken: {type: http, scheme: bearer}
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema: {$ref: '#/components/schemas/ID'}
  responses:
    RateLimited:
      description: Dataset/device request budget or process upload concurrency exhausted. Preserve immutable identity; recovery reads use a separate bounded budget.
      headers:
        Retry-After:
          description: Integer seconds until the suggested earliest retry; concurrent requests may consume the replenished slot.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema:
            type: object
            required: [code, retryAfterSeconds]
            properties:
              code: {enum: [device_rate_exceeded, dataset_rate_exceeded, device_upload_capacity_exceeded, upload_capacity_exceeded]}
              retryAfterSeconds: {type: integer, minimum: 1}
    Error:
      description: Stable reason code. No health values or raw database diagnostics.
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: {type: string}
              expectedSeq: {type: integer}
              expectedChunkIndex: {type: integer, minimum: 0}
              eventIndex: {type: integer, minimum: 0}
              field: {type: string, description: "Bundle field path, with zero-based array indices; $ for document errors"}
              reason: {type: string, description: "Stable validation category, never a health value"}
  schemas:
    CurrentAnalysis:
      type: object
      additionalProperties: false
      required: [scopeKey, runID, generation, algorithm, algorithmVersion, inputVersion, inputHash, publishedAt, computedAt, metrics]
      properties:
        scopeKey: {type: string}
        runID: {$ref: '#/components/schemas/ID'}
        generation: {type: integer, minimum: 1}
        algorithm: {type: string}
        algorithmVersion: {type: string}
        inputVersion: {type: string}
        inputHash: {type: string, pattern: '^[0-9a-f]{64}$'}
        publishedAt: {type: string, format: date-time}
        computedAt: {type: string, format: date-time}
        metrics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [metric, algorithm, algorithmVersion, value, unit, quality, details]
            properties:
              day: {type: string, format: date, description: Present for daily state only}
              metric: {type: string}
              algorithm: {type: string}
              algorithmVersion: {type: string}
              value: {type: [number, 'null']}
              unit: {type: string}
              quality: {type: string, enum: [available, partial, insufficient]}
              details: {type: object, additionalProperties: true}
    ChangePage:
      type: object
      additionalProperties: false
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [revision, ordinal, eventID, kind, key, operation]
            properties:
              revision: {type: integer, minimum: 1}
              ordinal: {type: integer, minimum: 0}
              eventID: {$ref: '#/components/schemas/ID'}
              kind: {type: string}
              key: {type: string}
              operation: {type: string}
        nextCursor: {type: string}
        hasMore: {type: boolean}
    ID: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', not: {const: '00000000-0000-0000-0000-000000000000'}}
    Handshake:
      type: object
      additionalProperties: false
      required: [protocolVersion, datasetID, datasetEpoch, serviceID, timezone, commitRevision, limits, capabilities]
      description: Runtime service identity and the enabled capability set. The handshake is authoritative for capabilities and numeric limits.
      properties:
        protocolVersion: {const: 3}
        datasetID: {$ref: '#/components/schemas/ID'}
        datasetEpoch: {$ref: '#/components/schemas/ID'}
        serviceID: {$ref: '#/components/schemas/ID'}
        timezone: {type: string, description: Business timezone; timestamps in the protocol remain UTC microseconds}
        commitRevision: {type: integer, minimum: 0}
        limits: {$ref: '#/components/schemas/HandshakeLimits'}
        capabilities: {$ref: '#/components/schemas/HandshakeCapabilities'}
    HandshakeLimits:
      type: object
      additionalProperties: false
      required: [bundleBytes, bundleEvents, bundleRoutes, bundleRoutePoints, requests, processUploads, processDeviceUploads, datasetUploads, deviceUploads]
      description: Current numeric limits. The runtime handshake returns the effective values for this deployment.
      properties:
        bundleWireBytes: {type: integer, minimum: 1}
        bundleCompressedBytes: {type: integer, minimum: 1}
        bundleBytes: {type: integer, minimum: 1, description: Maximum decoded JSON bytes}
        bundleEvents: {type: integer, minimum: 1, description: Maximum sample events in one Workout bundle}
        bundleRoutes: {type: integer, minimum: 1, description: Maximum routes in one Workout bundle}
        bundleRoutePoints: {type: integer, minimum: 1, description: Maximum route points in one Workout bundle}
        requests: {$ref: '#/components/schemas/RequestBudgets'}
        processUploads: {type: integer, minimum: 1, description: Per-process concurrent bundle uploads}
        processDeviceUploads: {type: integer, minimum: 1, description: Per-process concurrent bundle uploads for one device}
        datasetUploads: {type: integer, minimum: 1, description: Configured dataset request/upload budget}
        deviceUploads: {type: integer, minimum: 1, description: Configured device request/upload budget}
    HandshakeCapabilities:
      type: object
      additionalProperties: false
      required: [sampleTypes, workouts, workoutType, workoutPayloadVersion, workoutBundles, bundleProtocolVersion, routes, sampleWorkoutAssociations, changefeed, analysis]
      description: Explicit capability boundary for this deployment. Unsupported source fields must remain local; clients must not truncate them to fit.
      properties:
        sampleTypes:
          type: array
          minItems: 1
          uniqueItems: true
          description: Sorted sample identifiers accepted by this deployment. The runtime handshake is authoritative; this array is not a complete HealthKit type list.
          items: {type: string, minLength: 1}
        workouts: {const: true}
        workoutType: {const: HKWorkoutTypeIdentifier}
        workoutPayloadVersion: {const: 3, description: Highest Workout bundle payload version}
        bundleGzipPart: {type: boolean}
        workoutBundles: {const: true, description: "One multipart request carries one complete Workout, samples, series and routes"}
        bundleProtocolVersion: {const: 3}
        bundleObservationVersion: {const: 1, description: Optional Phase 3 observation contract}
        explicitChildDeletions: {const: true, description: Optional Phase 3 explicit deletion arrays in the same bundle}
        routes: {const: true, description: Routes are embedded in the bundle and published atomically}
        sampleWorkoutAssociations: {const: true, description: Bundle sample membership is the association; no per-sample call is exposed}
        changefeed: {const: false}
        analysis: {const: true}
    RequestBudgets:
      type: object
      additionalProperties: false
      required: [read, write, upload]
      properties:
        read: {$ref: '#/components/schemas/AdmissionPolicy'}
        write: {$ref: '#/components/schemas/AdmissionPolicy'}
        upload: {$ref: '#/components/schemas/AdmissionPolicy'}
    AdmissionPolicy:
      type: object
      additionalProperties: false
      required: [device, dataset]
      properties:
        device: {$ref: '#/components/schemas/RequestBudget'}
        dataset: {$ref: '#/components/schemas/RequestBudget'}
    RequestBudget:
      type: object
      additionalProperties: false
      required: [perMinute, burst]
      properties:
        perMinute: {type: integer, minimum: 1}
        burst: {type: integer, minimum: 1}
