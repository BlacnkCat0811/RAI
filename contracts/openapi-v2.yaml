openapi: 3.1.0
info:
  title: RAI native delta API
  version: 1.9.0
  description: >-
    Protocol 3 HealthKit Workout Bundle import: one multipart request carries one
    immutable Workout, all its scalar samples, multi-point quantity series and
    routes. The server validates and atomically commits facts, association
    membership, route/series projections, receipt, change log, dirty scope and
    one Workout analysis job. Legacy page/batch/association upload endpoints are not registered.
    The runtime handshake is authoritative for enabled capabilities and numeric
    limits. A partial change notification endpoint exists; complete changefeed
    is not supported yet. Versioned asynchronous analysis and current-result queries are supported.
    Phase 5 adds immutable training bases, persistent field overrides, Effective Plan
    versions, frozen executions and deterministic feedback. All mutation command IDs
    are immutable and replayable; manual edits survive recalculation.
    Protocol 4 clients may opt into per-Workout-UUID raw ingestion, where the
    first accepted payload is authoritative and later duplicates replay it.
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
servers:
  - url: http://127.0.0.1:8080
    description: Local development only; production requires HTTPS ingress.
security:
  - deviceToken: []
paths:
  /health:
    get:
      summary: Check process liveness
      operationId: getHealth
      security: []
      responses:
        '200': {description: Process responds}
  /ready:
    get:
      summary: Check database and schema readiness
      operationId: getReady
      security: []
      responses:
        '200': {description: Database and required schema reachable}
        '503': {$ref: '#/components/responses/Error'}
  /livez:
    get:
      summary: Check process liveness
      operationId: getLiveness
      security: []
      responses:
        '200': {description: Process responds}
  /readyz:
    get:
      summary: Check database and schema readiness
      operationId: getReadiness
      security: []
      responses:
        '200': {description: Database and required schema reachable}
        '503': {$ref: '#/components/responses/Error'}
  /v2/handshake:
    get:
      summary: Read service identity and supported capabilities
      operationId: getHandshake
      responses:
        '200':
          description: Bounded service metadata and explicit supported capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Handshake'}
              examples:
                synthetic:
                  summary: Synthetic deployment metadata
                  value:
                    protocolVersion: 3
                    datasetID: 11111111-1111-4111-8111-111111111111
                    datasetEpoch: 22222222-2222-4222-8222-222222222222
                    serviceID: 33333333-3333-4333-8333-333333333333
                    deviceID: 44444444-4444-4444-8444-444444444444
                    collectorEpoch: 55555555-5555-4555-8555-555555555555
                    datasetStatus: active
                    timezone: Asia/Shanghai
                    commitRevision: 42
                    limits:
                      bundleBytes: 33554432
                      bundleEvents: 50000
                      bundleRoutes: 16
                      bundleRoutePoints: 1000000
                      requests:
                        read:
                          device: {perMinute: 120, burst: 30}
                          dataset: {perMinute: 240, burst: 60}
                        write:
                          device: {perMinute: 60, burst: 10}
                          dataset: {perMinute: 120, burst: 20}
                        upload:
                          device: {perMinute: 30, burst: 2}
                          dataset: {perMinute: 60, burst: 4}
                      processUploads: 2
                      processDeviceUploads: 1
                      datasetUploads: 2
                      deviceUploads: 1
                    capabilities:
                      sampleTypes:
                        - HKCategoryTypeIdentifierSleepAnalysis
                        - HKQuantityTypeIdentifierHeartRate
                        - HKQuantityTypeIdentifierStepCount
                      workouts: true
                      workoutType: HKWorkoutTypeIdentifier
                      workoutPayloadVersion: 3
                      workoutBundles: true
                      bundleProtocolVersion: 3
                      routes: true
                      sampleWorkoutAssociations: true
                      changefeed: false
                      analysis: true
                      workoutSyncCompletenessV2Version: 2
                      workoutSourcePolicyVersion: rai.workout.source_policy.apple_watch_only/v1
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/sync/workout-completeness:
    post:
      summary: Commit verified Workout all-stream discovery evidence
      operationId: commitWorkoutCompleteness
      description: >-
        Independent control plane for visible running Workouts and all supported
        associated streams. Immutable final receipt follows dataset-locked stream,
        anchor, sequence, inventory and durable fact receipt verification. Client
        commits its staged anchors only after this ACK. No physiological formula,
        source selection, synthetic override or product activation is performed.
        The body contract selects the semantics: workout-sync-completeness/v1
        requires a Protocol 3 receipt for every visible Workout, while
        workout-sync-completeness/v2 requires every visible Workout to be either
        eligible (receipt) or explicitly excluded by the frozen source policy
        (re-verifiable evidence), with zero unclassified Workouts. An unknown
        contract is rejected with 422 unsupported_version; the two lineages are
        never reinterpreted as one another.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkoutCompletenessManifest'}
      responses:
        '200':
          description: Immutable verified completeness receipt
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/WorkoutCompletenessReceipt'}
                  - {$ref: '#/components/schemas/WorkoutCompletenessReceiptV2'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/sync/vo2max-facts:
    post:
      summary: Commit an independent vo2max-facts/v1 raw batch
      operationId: commitVO2MaxFacts
      description: >-
        At most 128 additions plus deletions and 524288 JSON bytes. Strict schema,
        per-type ordered stream, immutable batch retry and delete precedence.
        ACK follows atomic facts, tombstones, logs, dirty hooks and coverage commit.
        No Workout association, physiological aggregation or model computation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VO2Batch'}
      responses:
        '200':
          description: Immutable durable acknowledgement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VO2Receipt'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/sync/vo2max-facts/coverage:
    get:
      operationId: getVO2MaxCoverage
      summary: Inspect current collector VO2max observation coverage
      responses:
        '200':
          description: Epoch-fenced observation; read authorization remains not_determinable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VO2Coverage'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /v2/sync/daily-facts:
    post:
      summary: Commit an independent Daily Facts Sync v1 batch
      operationId: commitDailyFacts
      description: >-
        At most 128 additions plus deletions and 524288 JSON bytes. Strict schema,
        per-type ordered stream, immutable batch retry and delete precedence.
        ACK follows atomic facts, tombstones, logs, dirty hooks and coverage commit.
        No Workout association, physiological aggregation or model computation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DailyBatch'}
      responses:
        '200':
          description: Immutable durable acknowledgement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DailyReceipt'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/sync/daily-facts/coverage:
    get:
      summary: Read received daily discovery observations
      operationId: getDailyCoverage
      description: No read-permission or physiological freshness inference. See DAILY_HEALTH_SYNC_CONTRACT.md.
      responses:
        '200':
          description: Latest acknowledged observations in one database snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, coverage]
                properties:
                  version: {const: 1}
                  coverage:
                    type: array
                    minItems: 3
                    maxItems: 3
                    items: {$ref: '#/components/schemas/DailyCoverage'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/sync/workout-bundles:
    post:
      summary: Upload one complete Workout bundle in one multipart request
      operationId: importWorkoutBundle
      description: >-
        RQrun-style import unit. The multipart field is `file`, filename
        `workout.json` (application/json) or `workout.json.gz` (application/gzip).
        Hash identity always uses the original decoded JSON bytes. Whole wire
        body is limited to 32 MiB + 64 KiB, gzip file 8 MiB, decoded JSON 32 MiB. The document contains the
        Workout event, all scalar samples (membership is the association), all
        multi-point quantity series, and all routes. Validation and all fact,
        receipt, change-log, dirty-scope and analysis-job writes happen in one
        transaction. Missing Sample/Route entries never imply deletion;
        completeSampleTypes and completeRoutes describe read coverage only.
        Permanent deletion barriers are checked before returning an old import
        receipt, so late bundles cannot resurrect deleted identities.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Complete WorkoutBundle JSON or gzip JSON; decoded max 32 MiB; gzip max 8 MiB.
                  contentSchema: {$ref: '#/components/schemas/WorkoutBundle'}
      responses:
        '200':
          description: Original immutable bundle receipt, or the exact prior receipt for an identical bundle
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutImportReceipt'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/sync/workout-bundles/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      summary: Read an immutable Workout bundle receipt
      description: A 404 is an inconclusive lookup, never a deletion ACK. Retain the original bundle and retry the same bytes after durable backoff.
      operationId: getWorkoutBundle
      parameters:
        - in: query
          name: sha256
          required: false
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
          description: Exact bundle hash to read; omitted returns the newest receipt for the Workout.
      responses:
        '200':
          description: Immutable import receipt and queued analysis job identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutImportReceipt'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Explicitly delete a Workout and its routes
      operationId: deleteWorkoutBundle
      description: Explicit deletion only. Even an unknown Workout creates a permanent dataset-scoped tombstone. The dataset lock and epoch/collector fencing precede barrier lookup. Known Workouts retain their former time range and invalidate Workout analysis and Training State in the same transaction. COMMIT precedes ACK; retries return the original receipt/revision. A 404 is never durable deletion evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkoutDeleteRequest'}
      responses:
        '200':
          description: Durable deletion receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutDeleteReceipt'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/sync/workout-ingests/{workoutID}:
    parameters:
      - in: path
        name: workoutID
        required: true
        schema: {$ref: '#/components/schemas/ID'}
    post:
      summary: Accept one raw protocol-4 Workout payload by UUID
      operationId: acceptWorkoutIngest
      description: >-
        First successful reception of an HKWorkout UUID in this dataset is
        authoritative. The multipart field is `file` with the raw protocol-4
        JSON document (or its gzip form) exactly as specified by
        contracts/sync-v4.md. Only the wire envelope (identity, epochs,
        protocolVersion=4, UTF-8, duplicate keys, nesting, size) is validated
        before the acceptance transaction; samples, streams and routes are
        parsed by the Worker. The 200 response is written only after the
        acceptance row commits. A duplicate UUID replays the original
        acceptedAt even when its bytes differ, and never replaces the stored
        payload. A Workout that already exists without an ingest row returns
        already_imported. A root tombstone returns 409 workout_deleted.
        The endpoint is enabled only while the runtime handshake reports
        workoutUUIDIngestAccepting=true.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Exactly one raw v4 JSON or gzip file part; wire/decoded/gzip limits match POST /v2/sync/workout-bundles.
      responses:
        '200':
          description: Durable acceptance receipt, or already_imported for a pre-existing Workout
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutIngestReceipt'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    get:
      summary: Read one Workout ingest status in one database snapshot
      operationId: getWorkoutIngest
      description: >-
        Dataset-scoped status. Priority is fixed: deleted (root tombstone) >
        accepted/committed/rejected (ingest row) > already_imported (Workout
        facts only) > 404 workout_ingest_not_found. committed includes
        commitRevision, analysisStatus and analysisJobIDs; rejected includes
        errorCode. A 404 is never deletion evidence.
      responses:
        '200':
          description: Current ingest status for this dataset
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutIngestStatus'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/sync/changes:
    get:
      summary: Read bounded committed change notifications
      description: Notifications only; does not download full facts or chunk contents. The changefeed capability remains false.
      operationId: getChangeNotifications
      parameters:
        - in: query
          name: after
          schema: {type: string, default: '0'}
          description: Initial cursor 0 or an exact prior nextCursor, bound to the dataset and its epoch.
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Ordered notifications and a resumable position
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangePage'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/jobs/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      summary: Read a durable analysis job state
      operationId: getJob
      responses:
        '200':
          description: Durable job state; never substitutes for the fact receipt
          content:
            application/json:
              schema:
                type: object
                required: [jobID, kind, scopeKey, targetGeneration, state, attempts, lastErrorCode]
                properties:
                  jobID: {$ref: '#/components/schemas/ID'}
                  kind: {type: string}
                  scopeKey: {type: string}
                  targetGeneration: {type: integer}
                  state: {enum: [queued, running, succeeded, failed, repair_required]}
                  attempts: {type: integer}
                  lastErrorCode: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/analysis/workouts/{id}:
    get:
      summary: Read the current published Workout analysis
      operationId: getWorkoutAnalysis
      parameters:
        - name: id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
      responses:
        '200':
          description: Current clean publication; deleted or dirty Workouts are hidden
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentAnalysis'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v2/analysis/state:
    get:
      summary: Read today's clean published training state in dataset timezone
      operationId: getTrainingState
      responses:
        '200':
          description: Load-only state; insufficient inputs produce nullable metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentAnalysis'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v2/analysis/parameters:
    get: {"summary": "Read the latest explicit personal TRIMP parameters", "operationId": "getAnalysisParameters", "responses": {"200": {"description": "Latest append-only parameter set, or null when none was explicitly saved", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AnalysisParametersResponse"}}}}, "401": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
  /v2/training/plans:
    post: {"summary": "Create a current plan and archive the previous plan", "operationId": "createTrainingPlan", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingCreate"}}}}, "responses": {"200": {"description": "Durable receipt or current version", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingPlan"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "415": {"$ref": "#/components/responses/Error"}}, "x-response-byte-budget": 1048576, "description": "Requires application/json (standard media parameters allowed), no Content-Encoding, and a body of at most 65536 bytes. Missing/invalid media type or unsupported encoding returns 415; excess bytes return 413 training_request_too_large; malformed/duplicate/unknown/required/null/type or semantic errors return 422. Existing authentication and conflict rules apply.", "x-request-byte-budget": 65536}
  /v2/training/plans/current:
    get: {"summary": "Read the current plan including Effective Plan", "operationId": "getCurrentTrainingPlan", "responses": {"200": {"description": "Durable receipt or current version", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingPlan"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}}, "x-response-byte-budget": 1048576}
  /v2/training/plans/{id}:
    get: {"summary": "Read a plan including Effective Plan", "operationId": "getTrainingPlan", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/ID"}}], "responses": {"200": {"description": "Durable receipt or current version", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingPlan"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}}, "x-response-byte-budget": 1048576}
  /v2/training/plans/{id}/changes:
    post: {"summary": "Update goal or schedule or request recalculation", "operationId": "changeTrainingPlan", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/ID"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingChange"}}}}, "responses": {"200": {"description": "Durable receipt or current version", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingPlan"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "415": {"$ref": "#/components/responses/Error"}}, "x-response-byte-budget": 1048576, "description": "Requires application/json (standard media parameters allowed), no Content-Encoding, and a body of at most 65536 bytes. Missing/invalid media type or unsupported encoding returns 415; excess bytes return 413 training_request_too_large; malformed/duplicate/unknown/required/null/type or semantic errors return 422. Existing authentication and conflict rules apply.", "x-request-byte-budget": 65536}
  /v2/training/plans/{id}/overrides:
    post: {"summary": "Append an idempotent field override or revoke", "operationId": "putTrainingOverride", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/ID"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingOverrideRequest"}}}}, "responses": {"200": {"description": "Durable receipt or current version", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingEffective"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "415": {"$ref": "#/components/responses/Error"}}, "x-response-byte-budget": 1048576, "description": "Requires application/json (standard media parameters allowed), no Content-Encoding, and a body of at most 65536 bytes. Missing/invalid media type or unsupported encoding returns 415; excess bytes return 413 training_request_too_large; malformed/duplicate/unknown/required/null/type or semantic errors return 422. Existing authentication and conflict rules apply.", "x-request-byte-budget": 65536}
  /v2/training/plans/{id}/effective:
