        workoutID: {$ref: '#/components/schemas/ID'}
        bundleSHA256: {type: string, pattern: '^[0-9a-f]{64}$'}
        ingestStatus: {const: committed}
        commitRevision: {type: integer, minimum: 1}
        counts:
          type: object
          additionalProperties: false
          required: [workoutInserted, samplesInserted, samplesUnchanged, samplesDeleted, associationsInserted, associationsUnchanged, associationsDeleted, seriesInserted, seriesUnchanged, routesInserted, routesUnchanged, routesDeleted]
          properties:
            workoutInserted: {type: boolean}
            samplesInserted: {type: integer, minimum: 0}
            samplesUnchanged: {type: integer, minimum: 0}
            samplesDeleted: {type: integer, minimum: 0}
            associationsInserted: {type: integer, minimum: 0}
            associationsUnchanged: {type: integer, minimum: 0}
            associationsDeleted: {type: integer, minimum: 0}
            seriesInserted: {type: integer, minimum: 0}
            seriesUnchanged: {type: integer, minimum: 0}
            routesInserted: {type: integer, minimum: 0}
            routesUnchanged: {type: integer, minimum: 0}
            routesDeleted: {type: integer, minimum: 0}
        analysisStatus: {enum: [queued, not_required]}
        analysisJobIDs: {type: array, items: {$ref: '#/components/schemas/ID'}}
        sourceClassification: {enum: [apple_watch, source_unknown], description: Missing provenance is never Apple Watch proof; legacy imports are preserved but formal analysis waits for source evidence.}
        sourceObservation: {$ref: '#/components/schemas/BundleObservationSummary'}
        routeDiagnostics:
          type: object
          additionalProperties:
            type: array
            items: {enum: [timestamp_equal, timestamp_regression, before_workout, after_workout]}
    WorkoutDeleteRequest:
      type: object
      additionalProperties: false
      required: [protocolVersion, datasetID, datasetEpoch, collectorEpoch, workoutID]
      properties:
        protocolVersion: {const: 3}
        datasetID: {$ref: '#/components/schemas/ID'}
        datasetEpoch: {$ref: '#/components/schemas/ID'}
