  /v2/training/executions/{id}/changes:
    post: {"summary": "Start complete skip or explicitly associate a Workout", "operationId": "changeTrainingExecution", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/ID"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingExecutionChange"}}}}, "responses": {"200": {"description": "Durable receipt or current version", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingExecution"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "415": {"$ref": "#/components/responses/Error"}}, "x-response-byte-budget": 1048576, "description": "Requires application/json (standard media parameters allowed), no Content-Encoding, and a body of at most 65536 bytes. Missing/invalid media type or unsupported encoding returns 415; excess bytes return 413 training_request_too_large; malformed/duplicate/unknown/required/null/type or semantic errors return 422. Existing authentication and conflict rules apply.", "x-request-byte-budget": 65536}
  /v2/training/executions/{id}:
    get: {"summary": "Read frozen execution and feedback history", "operationId": "getTrainingExecution", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/ID"}}], "responses": {"200": {"description": "Durable receipt or current version", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingExecution"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}}, "x-response-byte-budget": 1048576}
  /v2/workouts:
    get: {"summary": "Read immutable Workout summaries with opaque keyset pagination", "operationId": "getProductWorkouts", "parameters": [{"name": "before", "in": "query", "required": false, "schema": {"type": "string", "maxLength": 128}}, {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}}], "responses": {"200": {"description": "Dataset-scoped read projection; missing values remain null", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProductWorkoutPage"}}}}, "401": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
  /v2/workouts/{id}:
    get: {"summary": "Read one Workout summary", "operationId": "getProductWorkout", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/ID"}}], "responses": {"200": {"description": "Dataset-scoped read projection; missing values remain null", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProductWorkoutPage"}}}}, "401": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
  /v2/workouts/{id}/detail:
    get: {"summary": "Read the native Workout detail: facts, environment correction, grade-adjusted summary, published load, zones, sampled route and manual override", "operationId": "getWorkoutDetail", "parameters": [{"name": "id", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/ID"}}], "responses": {"200": {"description": "One bounded detail projection. Derived fields stay null until analysis publication; route points are display-sampled to at most 500.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/WorkoutDetail"}}}}, "401": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}}}
  /v2/workouts/{id}/series:
