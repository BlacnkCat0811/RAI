openapi: 3.1.0
info:
  title: RAI native delta API
  version: 1.4.0
  description: >-
    Protocol 3 HealthKit Workout Bundle import: one multipart request carries one
    immutable Workout, all its scalar samples, multi-point quantity series and
    routes. The server validates and atomically commits facts, association
    membership, route/series projections, receipt, change log, dirty scope and
    one Workout analysis job. Legacy page/batch/association upload endpoints are not registered.
    The runtime handshake is authoritative for enabled capabilities and numeric
    limits. A partial change notification endpoint exists; complete changefeed
    is not supported yet. Versioned asynchronous analysis and current-result queries are supported.
    Phase 5 adds immutable training bases, persistent field overrides, Effective Plan
    versions, frozen executions and deterministic feedback. All mutation command IDs
    are immutable and replayable; manual edits survive recalculation.
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
servers:
  - url: http://127.0.0.1:8080
    description: Local development only; production requires HTTPS ingress.
security:
  - deviceToken: []
paths:
  /health:
    get:
      summary: Check process liveness
      operationId: getHealth
      security: []
      responses:
        '200': {description: Process responds}
  /ready:
    get:
      summary: Check database and schema readiness
      operationId: getReady
      security: []
      responses:
        '200': {description: Database and required schema reachable}
        '503': {$ref: '#/components/responses/Error'}
  /livez:
    get:
      summary: Check process liveness
      operationId: getLiveness
      security: []
      responses:
        '200': {description: Process responds}
  /readyz:
    get:
      summary: Check database and schema readiness
      operationId: getReadiness
      security: []
      responses:
        '200': {description: Database and required schema reachable}
        '503': {$ref: '#/components/responses/Error'}
  /v2/handshake:
    get:
      summary: Read service identity and supported capabilities
      operationId: getHandshake
      responses:
        '200':
          description: Bounded service metadata and explicit supported capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Handshake'}
              examples:
                synthetic:
                  summary: Synthetic deployment metadata
                  value:
                    protocolVersion: 3
                    datasetID: 11111111-1111-4111-8111-111111111111
                    datasetEpoch: 22222222-2222-4222-8222-222222222222
                    serviceID: 33333333-3333-4333-8333-333333333333
                    timezone: Asia/Shanghai
                    commitRevision: 42
                    limits:
                      bundleBytes: 33554432
                      bundleEvents: 50000
                      bundleRoutes: 16
                      bundleRoutePoints: 1000000
                      requests:
                        read:
                          device: {perMinute: 120, burst: 30}
                          dataset: {perMinute: 240, burst: 60}
                        write:
                          device: {perMinute: 60, burst: 10}
                          dataset: {perMinute: 120, burst: 20}
                        upload:
                          device: {perMinute: 30, burst: 2}
                          dataset: {perMinute: 60, burst: 4}
                      processUploads: 2
                      processDeviceUploads: 1
                      datasetUploads: 2
                      deviceUploads: 1
                    capabilities:
                      sampleTypes:
                        - HKCategoryTypeIdentifierSleepAnalysis
                        - HKQuantityTypeIdentifierHeartRate
                        - HKQuantityTypeIdentifierStepCount
                      workouts: true
                      workoutType: HKWorkoutTypeIdentifier
                      workoutPayloadVersion: 3
                      workoutBundles: true
                      bundleProtocolVersion: 3
                      routes: true
                      sampleWorkoutAssociations: true
                      changefeed: false
                      analysis: true
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/sync/workout-bundles:
    post:
      summary: Upload one complete Workout bundle in one multipart request
      operationId: importWorkoutBundle
      description: >-
        RQrun-style import unit. The multipart field is `file`, filename
        `workout.json` (application/json) or `workout.json.gz` (application/gzip).
        Hash identity always uses the original decoded JSON bytes. Whole wire
        body is limited to 32 MiB + 64 KiB, gzip file 8 MiB, decoded JSON 32 MiB. The document contains the
        Workout event, all scalar samples (membership is the association), all
        multi-point quantity series, and all routes. Validation and all fact,
        receipt, change-log, dirty-scope and analysis-job writes happen in one
        transaction. Missing Sample/Route entries never imply deletion;
        completeSampleTypes and completeRoutes describe read coverage only.
        Permanent deletion barriers are checked before returning an old import
        receipt, so late bundles cannot resurrect deleted identities.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Complete WorkoutBundle JSON or gzip JSON; decoded max 32 MiB; gzip max 8 MiB.
                  contentSchema: {$ref: '#/components/schemas/WorkoutBundle'}
      responses:
        '200':
          description: Original immutable bundle receipt, or the exact prior receipt for an identical bundle
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutImportReceipt'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/sync/workout-bundles/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      summary: Read an immutable Workout bundle receipt
      description: A 404 is an inconclusive lookup, never a deletion ACK. Retain the original bundle and retry the same bytes after durable backoff.
      operationId: getWorkoutBundle
      parameters:
        - in: query
          name: sha256
          required: false
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
          description: Exact bundle hash to read; omitted returns the newest receipt for the Workout.
      responses:
        '200':
          description: Immutable import receipt and queued analysis job identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutImportReceipt'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      summary: Explicitly delete a Workout and its routes
      operationId: deleteWorkoutBundle
      description: Explicit deletion only. Even an unknown Workout creates a permanent dataset-scoped tombstone. The dataset lock and epoch/collector fencing precede barrier lookup. Known Workouts retain their former time range and invalidate Workout analysis and Training State in the same transaction. COMMIT precedes ACK; retries return the original receipt/revision. A 404 is never durable deletion evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkoutDeleteRequest'}
      responses:
        '200':
          description: Durable deletion receipt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkoutDeleteReceipt'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/sync/changes:
    get:
      summary: Read bounded committed change notifications
      description: Notifications only; does not download full facts or chunk contents. The changefeed capability remains false.
      operationId: getChangeNotifications
      parameters:
        - in: query
          name: after
          schema: {type: string, default: '0'}
          description: Initial cursor 0 or an exact prior nextCursor, bound to the dataset and its epoch.
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Ordered notifications and a resumable position
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangePage'}
        '401': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/jobs/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      summary: Read a durable analysis job state
      operationId: getJob
      responses:
        '200':
          description: Durable job state; never substitutes for the fact receipt
          content:
            application/json:
              schema:
                type: object
                required: [jobID, kind, scopeKey, targetGeneration, state, attempts, lastErrorCode]
                properties:
                  jobID: {$ref: '#/components/schemas/ID'}
                  kind: {type: string}
                  scopeKey: {type: string}
                  targetGeneration: {type: integer}
                  state: {enum: [queued, running, succeeded, failed, repair_required]}
                  attempts: {type: integer}
                  lastErrorCode: {type: [string, 'null']}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        default: {$ref: '#/components/responses/Error'}
  /v2/analysis/workouts/{id}:
    get:
      summary: Read the current published Workout analysis
      operationId: getWorkoutAnalysis
      parameters:
        - name: id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ID'}
      responses:
        '200':
          description: Current clean publication; deleted or dirty Workouts are hidden
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentAnalysis'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v2/analysis/state:
    get:
      summary: Read today's clean published training state in dataset timezone
      operationId: getTrainingState
      responses:
        '200':
          description: Load-only state; insufficient inputs produce nullable metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentAnalysis'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /v2/training/plans:
    post: {"summary": "Create a current plan and archive the previous plan", "operationId": "createTrainingPlan", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingCreate"}}}}, "responses": {"200": {"description": "Durable receipt or current version", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingPlan"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}, "415": {"$ref": "#/components/responses/Error"}}, "x-response-byte-budget": 1048576, "description": "Requires application/json (standard media parameters allowed), no Content-Encoding, and a body of at most 65536 bytes. Missing/invalid media type or unsupported encoding returns 415; excess bytes return 413 training_request_too_large; malformed/duplicate/unknown/required/null/type or semantic errors return 422. Existing authentication and conflict rules apply.", "x-request-byte-budget": 65536}
  /v2/training/plans/current:
    get: {"summary": "Read the current plan including Effective Plan", "operationId": "getCurrentTrainingPlan", "responses": {"200": {"description": "Durable receipt or current version", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/TrainingPlan"}}}}, "401": {"$ref": "#/components/responses/Error"}, "403": {"$ref": "#/components/responses/Error"}, "404": {"$ref": "#/components/responses/Error"}, "409": {"$ref": "#/components/responses/Error"}, "422": {"$ref": "#/components/responses/Error"}, "429": {"$ref": "#/components/responses/Error"}, "503": {"$ref": "#/components/responses/Error"}, "413": {"$ref": "#/components/responses/Error"}}, "x-response-byte-budget": 1048576}
  /v2/training/plans/{id}:
