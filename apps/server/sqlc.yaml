version: '2'
sql:
  - engine: postgresql
    queries: queries
    schema: migrations
    gen:
      go:
        package: dbgen
        out: internal/storage/postgres/dbgen
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
