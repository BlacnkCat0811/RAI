# Overlay on deploy/release/compose.yaml for the authorized 2 GiB cloud test host.
# PostgreSQL remains private; Nginx forwards /v2/ to the loopback TLS API.
services:
  postgres:
    mem_limit: 512m
    cpus: 0.75
    shm_size: 128m
    command: [postgres, -c, timezone=UTC, -c, max_connections=40, -c, shared_buffers=128MB, -c, work_mem=2MB, -c, maintenance_work_mem=32MB, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
  api:
    mem_limit: 256m
    cpus: 0.75
    environment:
      GOMEMLIMIT: 192MiB
  worker:
    mem_limit: 384m
    cpus: 0.75
    environment:
      GOMEMLIMIT: 288MiB
