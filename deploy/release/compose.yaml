# Preparation template. No implicit migration, init, public ingress or backup.
name: ${RAI_PROJECT:?set a distinct Compose project name}
x-log: &log
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-app: &app
  image: ${RAI_RELEASE_IMAGE:?use the reviewed release image digest}
  read_only: true
  user: '65532:65532'
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 15s
  pids_limit: 128
  logging: *log
services:
  postgres:
    image: ${RAI_POSTGRES_IMAGE:-postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc}
    environment:
      POSTGRES_DB: rai_v2
      POSTGRES_USER: rai_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_bootstrap_password
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
      TZ: UTC
    command: [postgres, -c, timezone=UTC, -c, max_connections=40, -c, shared_buffers=256MB, -c, work_mem=4MB, -c, maintenance_work_mem=64MB, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0]
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres:/opt/rai:ro
    secrets: [pg_bootstrap_password, pg_owner_password, pg_api_password, pg_worker_password, pg_backup_password, pg_monitor_password]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U rai_bootstrap -d rai_v2']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    shm_size: 256m
    logging: *log
  api:
    <<: *app
    command: [api]
    environment:
      RAI_DATABASE_URL_FILE: /run/secrets/api_dsn
      RAI_ENFORCE_RUNTIME_ROLE: '1'
      RAI_LISTEN_ADDR: 0.0.0.0:8443
      RAI_REQUIRE_TLS: '1'
      RAI_TLS_CERT_FILE: /run/secrets/tls_cert
      RAI_TLS_KEY_FILE: /run/secrets/tls_key
      RAI_TLS_SERVER_NAME: ${RAI_TLS_SERVER_NAME:?set certificate hostname}
      RAI_TLS_CA_FILE: /run/secrets/tls_ca
      GOMEMLIMIT: 384MiB
      GOMAXPROCS: '1'
    secrets: [api_dsn, tls_cert, tls_key, tls_ca]
    ports: ['${RAI_BIND_ADDRESS:-127.0.0.1}:${RAI_HTTPS_PORT:-8443}:8443']
    networks: [edge, database]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, /rai, probe, --ready]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 6
    mem_limit: 512m
    cpus: 1.0
  worker:
    <<: *app
    command: [worker]
    environment:
      RAI_DATABASE_URL_FILE: /run/secrets/worker_dsn
      RAI_ENFORCE_RUNTIME_ROLE: '1'
      GOMEMLIMIT: 768MiB
      GOMAXPROCS: '1'
    secrets: [worker_dsn]
    networks: [database]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      # PID 1 is the real worker. This additionally checks DB/schema/role.
      test: [CMD, /rai, worker-ready]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 1g
    cpus: 1.0
  admin:
    <<: *app
    profiles: [tools]
    restart: 'no'
    command: [migrate-status]
    environment:
      RAI_DATABASE_URL_FILE: /run/secrets/owner_dsn
    secrets: [owner_dsn]
    networks: [database]
    mem_limit: 512m
    cpus: 1.0
  monitor:
    <<: *app
    profiles: [tools]
    restart: 'no'
    command: [ops, snapshot]
    environment:
      RAI_DATABASE_URL_FILE: /run/secrets/monitor_dsn
    secrets: [monitor_dsn]
    networks: [database]
    mem_limit: 256m
    cpus: 0.5
networks:
  edge: {}
  database: {internal: true}
volumes:
  pgdata: {}
secrets:
  pg_bootstrap_password: {file: '${RAI_SECRETS_DIR:?restricted secret directory}/pg_bootstrap_password'}
  pg_owner_password: {file: '${RAI_SECRETS_DIR}/pg_owner_password'}
  pg_api_password: {file: '${RAI_SECRETS_DIR}/pg_api_password'}
  pg_worker_password: {file: '${RAI_SECRETS_DIR}/pg_worker_password'}
  pg_backup_password: {file: '${RAI_SECRETS_DIR}/pg_backup_password'}
  pg_monitor_password: {file: '${RAI_SECRETS_DIR}/pg_monitor_password'}
  api_dsn: {file: '${RAI_SECRETS_DIR}/api_dsn'}
  worker_dsn: {file: '${RAI_SECRETS_DIR}/worker_dsn'}
  owner_dsn: {file: '${RAI_SECRETS_DIR}/owner_dsn'}
  monitor_dsn: {file: '${RAI_SECRETS_DIR}/monitor_dsn'}
  tls_cert: {file: '${RAI_SECRETS_DIR}/tls_cert'}
  tls_key: {file: '${RAI_SECRETS_DIR}/tls_key'}
  tls_ca: {file: '${RAI_SECRETS_DIR}/tls_ca'}
