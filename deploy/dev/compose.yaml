# Isolated synthetic development only; never point this volume at legacy data.
services:
  postgres:
    image: ${RAI_DEV_POSTGRES_IMAGE:-postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc}
    environment:
      POSTGRES_DB: rai_dev
      POSTGRES_USER: rai_dev
      POSTGRES_PASSWORD: development-only
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:${RAI_DEV_DB_PORT:-55432}:5432"
    volumes:
      - rai_dev_pg:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U rai_dev -d rai_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    image: ${RAI_DEV_IMAGE:-rai-dev:local}
    build:
      context: ../../apps/server
      args:
        GOPROXY: ${RAI_DEV_GOPROXY:-https://proxy.golang.org,direct}
        GO_IMAGE: ${RAI_DEV_GO_IMAGE:-golang:1.27.3-alpine@sha256:d200d2dd76b03a99b52651fd1325aff7dcd35422c35c01bac56571b0507f3deb}
    command: [api]
    environment:
      RAI_DATABASE_URL: postgres://rai_dev:development-only@postgres:5432/rai_dev?sslmode=disable
      RAI_LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:${RAI_DEV_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, /rai, probe]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  worker:
    image: ${RAI_DEV_IMAGE:-rai-dev:local}
    command: [worker]
    environment:
      RAI_DATABASE_URL: postgres://rai_dev:development-only@postgres:5432/rai_dev?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  rai_dev_pg:
